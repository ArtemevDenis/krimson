[project]
name = "krimson-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
cv = [
    "opencv-python-headless>=5.0.0.93",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.182",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

# CUDA build on Windows (RTX 2060 Super / Turing is supported by cu126); default wheels elsewhere
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
